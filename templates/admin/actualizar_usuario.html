{% extends 'base.html' %}
{% block title %}Actualizar Usuario - Rock Corporation{% endblock %}
{% block content %}
<section class="page-hero dark">
    <div class="hero-copy">
        <div class="eyebrow">Seguridad</div>
        <h1 class="rock-title">Actualizar usuario</h1>
        <p class="rock-copy">Edita los datos, permisos y estado del usuario.</p>
    </div>
</section>

<section class="panel-card">
    <div class="section-head">
        <h2>Información de usuario</h2>
    </div>



    <form class="form-panel" method="POST" action="{{ url_for('actualizar_usuario', usuario_id=usuario.id) }}">
        <div class="field">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre_completo }}" required>
        </div>
        <div class="field">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" value="{{ usuario.correo }}" required>
        </div>
        <div class="field">
            <label for="rol">Rol</label>
            <select id="rol" name="rol" required>
                {% for rol in roles %}
                    <option value="{{ rol }}" {% if usuario.rol == rol %}selected{% endif %}>{{ rol }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="estado">Estado</label>
            <select id="estado" name="estado" required>
                <option value="activo" {% if usuario.estado == 'activo' %}selected{% endif %}>Activo</option>
                <option value="inactivo" {% if usuario.estado == 'inactivo' %}selected{% endif %}>Inactivo</option>
            </select>
        </div>
        <div class="field">
            <label for="nueva_password">Nueva contraseña opcional</label>
            <input type="password" id="nueva_password" name="nueva_password" minlength="8" placeholder="Déjala vacía para conservar la actual">
        </div>
        <div class="hero-actions" style="margin-top:20px;">
            <button class="rock-btn primary" type="submit">Guardar cambios</button>
            <a class="rock-link" href="{{ url_for('admin_usuarios') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
